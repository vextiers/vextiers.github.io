<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VEXTIERS — Admin</title>

    <style>
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 60px;
        }

        h1 {
            color: #7A00FF;
            text-shadow: 0 0 15px #7A00FF;
            font-size: 48px;
        }

        .box {
            background: #111;
            width: 60%;
            margin: 40px auto;
            padding: 25px;
            border-radius: 14px;
            border: 2px solid #7A00FF;
            box-shadow: 0 0 25px #7A00FF55;
            text-align: left;
        }

        label {
            font-size: 18px;
            color: #7A00FF;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 18px;
            background: #222;
            color: #e0e0e0;
            border: 1px solid #7A00FF;
            border-radius: 8px;
        }

        textarea {
            height: 200px;
            resize: none;
            font-family: monospace;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #7A00FF;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 15px #7A00FF;
        }

        button:hover {
            box-shadow: 0 0 25px #7A00FF;
        }

        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #ff6666;
        }
    </style>
</head>

<body>

<h1>VEXTIERS Admin</h1>

<!-- ACCESS GATE -->
<div class="box" id="gate">
    <label>Enter access code</label>
    <input id="codeInput" type="password" placeholder="Access code">
    <button onclick="checkCode()">Unlock</button>
    <div id="status"></div>
</div>

<!-- ADMIN PANEL -->
<div class="box" id="panel" style="display:none;">

    <label>Player Name</label>
    <input id="playerName" type="text">

    <label>Mode Tiers</label>

    <div id="modeInputs"></div>

    <button onclick="generateJSON()">Generate JSON</button>

    <label style="margin-top:20px;">Copy‑paste JSON output</label>
    <textarea id="outputBox" readonly></textarea>
</div>

<script>
const ACCESS_CODE = "052601";

const modes = [
    "vanilla",
    "crystal",
    "mace",
    "diamond_pot",
    "netherite_pot",
    "uhc",
    "smp",
    "sword",
    "axe"
];

const tierValues = {
    "HT1": 10,
    "HT2": 9,
    "HT3": 8,
    "LT1": 7,
    "LT2": 6,
    "LT3": 5,
    "LT4": 4,
    "LT5": 3
};

function checkCode() {
    const input = document.getElementById("codeInput").value;
    const status = document.getElementById("status");

    if (input === ACCESS_CODE) {
        document.getElementById("gate").style.display = "none";
        document.getElementById("panel").style.display = "block";
        loadModeInputs();
    } else {
        status.textContent = "Wrong code.";
    }
}

function loadModeInputs() {
    const container = document.getElementById("modeInputs");
    container.innerHTML = "";

    modes.forEach(mode => {
        container.innerHTML += `
            <label>${mode.toUpperCase()}</label>
            <select id="${mode}">
                <option value="">Not Tested</option>
                <option value="HT1">HT1</option>
                <option value="HT2">HT2</option>
                <option value="HT3">HT3</option>
                <option value="LT1">LT1</option>
                <option value="LT2">LT2</option>
                <option value="LT3">LT3</option>
                <option value="LT4">LT4</option>
                <option value="LT5">LT5</option>
            </select>
        `;
    });
}

function calculateOverallTier(modeData) {
    let total = 0;
    let count = 0;

    for (const mode in modeData) {
        const tier = modeData[mode];
        if (tier) {
            total += tierValues[tier];
            count++;
        }
    }

    if (count === 0) return "LT5";

    const avg = Math.round(total / count);

    return Object.keys(tierValues).find(key => tierValues[key] === avg);
}

function generateJSON() {
    const name = document.getElementById("playerName").value;

    const modeData = {};
    modes.forEach(mode => {
        const tier = document.getElementById(mode).value || null;
        modeData[mode] = tier;
    });

    const overallTier = calculateOverallTier(modeData);

    const payload = {
        name: name,
        tier: overallTier,
        modes: modeData
    };

    document.getElementById("outputBox").value =
        JSON.stringify(payload, null, 4);
}
</script>

</body>
</html>
