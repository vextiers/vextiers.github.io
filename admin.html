<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VEXTIERS — Admin</title>

    <style>
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 60px;
        }

        h1 {
            color: #7A00FF;
            text-shadow: 0 0 15px #7A00FF;
            font-size: 48px;
        }

        .box {
            background: #111;
            width: 50%;
            margin: 40px auto;
            padding: 25px;
            border-radius: 14px;
            border: 2px solid #7A00FF;
            box-shadow: 0 0 25px #7A00FF55;
            text-align: left;
        }

        label {
            font-size: 18px;
            color: #7A00FF;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 18px;
            background: #222;
            color: #e0e0e0;
            border: 1px solid #7A00FF;
            border-radius: 8px;
        }

        textarea {
            height: 180px;
            resize: none;
            font-family: monospace;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #7A00FF;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 15px #7A00FF;
        }

        button:hover {
            box-shadow: 0 0 25px #7A00FF;
        }

        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #ff6666;
        }
    </style>
</head>

<body>

<h1>VEXTIERS Admin</h1>

<!-- ACCESS GATE -->
<div class="box" id="gate">
    <label>Enter access code</label>
    <input id="codeInput" type="password" placeholder="Access code">
    <button onclick="checkCode()">Unlock</button>
    <div id="status"></div>
</div>

<!-- ADMIN PANEL -->
<div class="box" id="panel" style="display:none;">
    <label>Player Name</label>
    <input id="playerName" type="text">

    <label>Mode</label>
    <select id="mode">
        <option value="mace">Mace</option>
        <option value="crystal">Crystal</option>
        <option value="sword">Sword</option>
        <option value="bow">Bow</option>
    </select>

    <label>Tier</label>
    <select id="tier">
        <option value="HT1">HT1</option>
        <option value="HT2">HT2</option>
        <option value="HT3">HT3</option>
        <option value="LT1">LT1</option>
        <option value="LT2">LT2</option>
        <option value="LT3">LT3</option>
        <option value="LT4">LT4</option>
        <option value="LT5">LT5</option>
    </select>

    <button onclick="generateJSON()">Generate JSON</button>

    <label style="margin-top:20px;">Copy‑Paste JSON Output</label>
    <textarea id="outputBox" readonly></textarea>
</div>

<script>
const ACCESS_CODE = "052601";

function checkCode() {
    const input = document.getElementById("codeInput").value;
    const status = document.getElementById("status");

    if (input === ACCESS_CODE) {
        document.getElementById("gate").style.display = "none";
        document.getElementById("panel").style.display = "block";
    } else {
        status.textContent = "Wrong code.";
    }
}

function generateJSON() {
    const name = document.getElementById("playerName").value;
    const mode = document.getElementById("mode").value;
    const tier = document.getElementById("tier").value;

    const payload = {
        name: name,
        mode: mode,
        tier: tier
    };

    document.getElementById("outputBox").value =
        JSON.stringify(payload, null, 4);
}
</script>

</body>
</html>
