<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VEXTIERS — Players</title>

    <style>
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 3px solid #7A00FF;
            box-shadow: 0 0 25px #7A00FF55;
            background: linear-gradient(180deg, #0f0f0f, #0a0a0a);
        }

        h1 {
            font-size: 48px;
            color: #7A00FF;
            text-shadow: 0 0 18px #7A00FF;
            letter-spacing: 2px;
        }

        .playerCard {
            background: #111;
            width: 80%;
            margin: 25px auto;
            padding: 20px;
            border-radius: 14px;
            border: 2px solid #7A00FF;
            box-shadow: 0 0 25px #7A00FF55;
        }

        .playerCard h2 {
            color: #7A00FF;
            text-shadow: 0 0 12px #7A00FF;
            margin-bottom: 10px;
        }

        .modeList {
            margin-top: 10px;
            padding-left: 20px;
        }

        .modeList li {
            margin: 4px 0;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <h1>VEXTIERS — Players</h1>
</header>

<div id="playersContainer"></div>

<script>
// Convert tier label → number
function tierToNumber(tier) {
    const map = {
        "HT1": 10,
        "HT2": 9,
        "HT3": 8,
        "LT1": 7,
        "LT2": 6,
        "LT3": 5,
        "LT4": 4,
        "LT5": 3
    };
    return map[tier] || null;
}

// Convert number → tier label
function numberToTier(num) {
    const map = {
        10: "HT1",
        9: "HT2",
        8: "HT3",
        7: "LT1",
        6: "LT2",
        5: "LT3",
        4: "LT4",
        3: "LT5"
    };
    return map[num] || "Unknown";
}

// Calculate average tier score
function calculateAverageTier(modes) {
    let total = 0;
    let count = 0;

    for (const mode in modes) {
        if (modes[mode] !== null) {
            const num = tierToNumber(modes[mode]);
            if (num !== null) {
                total += num;
                count++;
            }
        }
    }

    return { total, count };
}

fetch("players.json")
    .then(res => res.json())
    .then(players => {

        players.forEach(p => {
            const { total, count } = calculateAverageTier(p.modes);

            p.testedModes = count;
            p.averageTierScore = count > 0 ? total / count : 0;
            p.overallTier = numberToTier(Math.round(p.averageTierScore));
        });

        // GLOBAL RANKING SYSTEM:
        // 1. More tested modes = higher rank
        // 2. Higher average tier score = higher rank
        players.sort((a, b) => {
            if (b.testedModes !== a.testedModes) {
                return b.testedModes - a.testedModes;
            }
            return b.averageTierScore - a.averageTierScore;
        });

        const container = document.getElementById("playersContainer");

        players.forEach((p, index) => {
            const card = document.createElement("div");
            card.className = "playerCard";

            card.innerHTML = `
                <h2>#${index + 1} — ${p.name}</h2>
                <strong>Overall Tier:</strong> ${p.overallTier}<br>
                <strong>Tested Modes:</strong> ${p.testedModes}<br><br>

                <strong>Mode Tiers:</strong>
                <ul class="modeList">
                    ${Object.entries(p.modes)
                        .map(([mode, tier]) => `<li>${mode}: ${tier ?? "N/A"}</li>`)
                        .join("")}
                </ul>
            `;

            container.appendChild(card);
        });
    });
</script>

</body>
</html>
