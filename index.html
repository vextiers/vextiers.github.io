<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VEXTIERS — Home</title>

    <style>
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 3px solid #7A00FF;
            box-shadow: 0 0 25px #7A00FF55;
            background: #0f0f0f;
        }

        h1 {
            font-size: 52px;
            color: #7A00FF;
            text-shadow: 0 0 22px #7A00FF;
            letter-spacing: 2px;
        }

        /* MODE BAR CONTAINER */
        .modeContainer {
            position: relative;
            width: 100%;
        }

        /* UNDERLINE ABOVE BUTTONS */
        #selectedBar {
            position: absolute;
            top: 0;
            height: 10px;
            background: #7A00FF;
            box-shadow: 0 0 18px #7A00FFAA;
            transition: 0.2s ease;
        }

        /* FULL WIDTH MODE BAR */
        .modeBar {
            width: 100%;
            display: flex;
            margin: 0;
            padding: 0;
        }

        /* PILL TOP, FLAT BOTTOM BUTTONS */
        .modeButton {
            flex: 1;
            height: 110px;
            background: #111;
            border: 2px solid #7A00FF;
            border-bottom: none;
            border-radius: 22px 22px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            cursor: pointer;
            padding-bottom: 10px;
            transition: 0.15s;
        }

        .modeButton:hover {
            background: #1a1a1a;
            box-shadow: 0 0 25px #7A00FFAA;
        }

        .modeIcon {
            width: 48px;
            height: 48px;
            margin-bottom: 6px;
        }

        .modeText {
            font-size: 18px;
            color: #e0e0e0;
            text-align: center;
        }

        .leaderboard {
            width: 90%;
            margin: 40px auto;
        }

        .playerRow {
            display: flex;
            align-items: center;
            background: #111;
            padding: 28px;
            margin-bottom: 20px;
            border-radius: 14px;
            border: 2px solid #7A00FF;
            box-shadow: 0 0 28px #7A00FF55;
        }

        .rank {
            width: 80px;
            font-size: 36px;
            font-weight: bold;
            color: #7A00FF;
            text-shadow: 0 0 12px #7A00FF;
            text-align: center;
        }

        .nameBlock {
            flex: 1;
            padding-left: 25px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .playerName {
            font-size: 32px;
            font-weight: bold;
        }

        .skinHead {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            image-rendering: pixelated;
            box-shadow: 0 0 12px #7A00FFAA;
            border: 2px solid #7A00FF;
        }

        .modeBlock {
            display: flex;
            gap: 16px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-left: 20px;
        }

        .modeTag {
            background: #222;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid #7A00FF;
            font-size: 20px;
            white-space: nowrap;
        }
    </style>
</head>

<body>

<header>

        <div class="modeButton" data-mode="sword"><div class="modeIcon"></div><div class="modeText">Sword</div></div>
        <div class="modeButton" data-mode="axe"><div class="modeIcon"></div><div class="modeText">Axe</div></div>
        <div class="modeButton" data-mode="uhc"><div class="modeIcon"></div><div class="modeText">UHC</div></div>
        <div class="modeButton" data-mode="smp"><div class="modeIcon"></div><div class="modeText">SMP</div></div>
        <div class="modeButton" data-mode="diamond_pot"><div class="modeIcon"></div><div class="modeText">Pot</div></div>
        <div class="modeButton" data-mode="netherite_pot"><div class="modeIcon"></div><div class="modeText">Neth Pot</div></div>
    </div>
</div>

<div class="leaderboard" id="leaderboard"></div>

<script>
// tier mapping
function tierToNumber(tier) {
    const map = {
        "LT5": 1, "HT5": 2,
        "LT4": 3, "HT4": 4,
        "LT3": 5, "HT3": 6,
        "LT2": 7, "HT2": 8,
        "LT1": 9, "HT1": 10
    };
    return map[tier] || null;
}

function numberToTier(num) {
    const map = {
        1: "LT5", 2: "HT5",
        3: "LT4", 4: "HT4",
        5: "LT3", 6: "HT3",
        7: "LT2", 8: "HT2",
        9: "LT1", 10: "HT1"
    };
    return map[num] || "Unknown";
}

function calculateAverageTier(modes) {
    let total = 0;
    let count = 0;

    for (const mode in modes) {
        if (modes[mode] !== null) {
            const num = tierToNumber(modes[mode]);
            if (num !== null) {
                total += num;
                count++;
            }
        }
    }

    return { total, count };
}

function getSkinURL(player) {
    return `https://mc-heads.net/avatar/${encodeURIComponent(player.name)}/64`;
}

function updateSelectedBar(mode) {
    const buttons = Array.from(document.querySelectorAll(".modeButton"));
    const btn = buttons.find(b => b.dataset.mode === mode);
    const bar = document.getElementById("selectedBar");

    bar.style.width = btn.offsetWidth + "px";
    bar.style.left = btn.offsetLeft + "px";
}
