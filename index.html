<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FierceTiers</title>

    <style>
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            padding: 60px 20px;
            background: linear-gradient(180deg, #0f0f0f, #0a0a0a);
            border-bottom: 3px solid #7A00FF;
            box-shadow: 0 0 25px #7A00FF55;
        }

        h1 {
            font-size: 52px;
            color: #7A00FF;
            text-shadow: 0 0 15px #7A00FF;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 20px;
            opacity: 0.8;
        }

        .card {
            background: #111;
            width: 70%;
            margin: 40px auto;
            padding: 25px;
            border-radius: 14px;
            border: 2px solid #7A00FF;
            box-shadow: 0 0 20px #7A00FF55;
        }

        .card h2 {
            color: #7A00FF;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #7A00FF;
        }

        footer {
            margin-top: 60px;
            padding: 20px;
            font-size: 14px;
            opacity: 0.5;
        }

        a {
            color: #7A00FF;
            text-decoration: none;
        }

        a:hover {
            text-shadow: 0 0 10px #7A00FF;
        }
    </style>
</head>

<body>

    <header>
        <h1>FierceTiers</h1>
        <p class="subtitle">Global Java PvP Rankings — LT5 → HT1</p>
    </header>

    <div class="card">
        <h2>Welcome to the VEX Tier Hub</h2>
        <p>This site hosts the official FierceTiers global PvP ranking system.</p>
        <p>Player tiers, mode tiers, and VEX‑style competitive metrics coming soon.</p>
    </div>

    <footer>
        FierceTiers © 2026 — VEX Powered
    </footer>

</body>
</html>
