<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VEXTIERS — Home</title>

    <style>
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 3px solid #7A00FF;
            box-shadow: 0 0 25px #7A00FF55;
            background: #0f0f0f;
        }

        h1 {
            font-size: 52px;
            color: #7A00FF;
            text-shadow: 0 0 22px #7A00FF;
            letter-spacing: 2px;
        }

        .selectorBox {
            width: 90%;
            margin: 30px auto;
            text-align: center;
        }

        select {
            background: #111;
            color: #e0e0e0;
            padding: 14px;
            font-size: 22px;
            border: 2px solid #7A00FF;
            border-radius: 12px;
            box-shadow: 0 0 18px #7A00FF55;
        }

        .leaderboard {
            width: 90%;
            margin: 40px auto;
        }

        .playerRow {
            display: flex;
            align-items: center;
            background: #111;
            padding: 28px;
            margin-bottom: 20px;
            border-radius: 14px;
            border: 2px solid #7A00FF;
            box-shadow: 0 0 28px #7A00FF55;
        }

        .rank {
            width: 80px;
            font-size: 36px;
            font-weight: bold;
            color: #7A00FF;
            text-shadow: 0 0 12px #7A00FF;
            text-align: center;
        }

        .nameBlock {
            flex: 1;
            padding-left: 25px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .playerName {
            font-size: 32px;
            font-weight: bold;
        }

        .skinHead {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            image-rendering: pixelated;
            box-shadow: 0 0 12px #7A00FFAA;
            border: 2px solid #7A00FF;
        }

        .modeBlock {
            display: flex;
            gap: 16px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-left: 20px;
        }

        .modeTag {
            background: #222;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid #7A00FF;
            font-size: 20px;
            white-space: nowrap;
        }
    </style>
</head>

<body>

<header>
    <h1>VEXTIERS</h1>
</header>

<div class="selectorBox">
    <select id="modeSelector">
        <option value="overall">Overall Rankings</option>
        <option value="crystal">Crystal</option>
        <option value="mace">Mace</option>
        <option value="diamond_pot">Diamond-Pot</option>
        <option value="netherite_pot">Netherite-Pot</option>
        <option value="uhc">UHC</option>
        <option value="smp">SMP</option>
        <option value="sword">Sword</option>
        <option value="axe">Axe</option>
    </select>
</div>

<div class="leaderboard" id="leaderboard"></div>

<script>
// tier mapping: LT5, HT5, LT4, HT4, LT3, HT3, LT2, HT2, LT1, HT1 (bottom → top)
function tierToNumber(tier) {
    const map = {
        "LT5": 1,
        "HT5": 2,
        "LT4": 3,
        "HT4": 4,
        "LT3": 5,
        "HT3": 6,
        "LT2": 7,
        "HT2": 8,
        "LT1": 9,
        "HT1": 10
    };
    return map[tier] || null;
}

function numberToTier(num) {
    const map = {
        1: "LT5",
        2: "HT5",
        3: "LT4",
        4: "HT4",
        5: "LT3",
        6: "HT3",
        7: "LT2",
        8: "HT2",
        9: "LT1",
        10: "HT1"
    };
    return map[num] || "Unknown";
}

function calculateAverageTier(modes) {
    let total = 0;
    let count = 0;

    for (const mode in modes) {
        if (modes[mode] !== null) {
            const num = tierToNumber(modes[mode]);
            if (num !== null) {
                total += num;
                count++;
            }
        }
    }

    return { total, count };
}

document.getElementById("modeSelector").addEventListener("change", () => {
    loadRankings();
});

// Hybrid skin system
function getSkinURL(username) {
    const mcHeads = `https://mc-heads.net/avatar/${encodeURIComponent(username)}/64`;
    const skLauncher = `https://skins.sklauncher.net/head/${encodeURIComponent(username)}`;

    // Try MCHeads first, fallback to SKLauncher
    return new Promise(resolve => {
        const img = new Image();
        img.src = mcHeads;

        img.onload = () => resolve(mcHeads);     // Mojang skin exists
        img.onerror = () => resolve(skLauncher); // Cracked → SKLauncher
    });
}

function loadRankings() {
    const selectedMode = document.getElementById("modeSelector").value;

    fetch("players.json")
        .then(res => res.json())
        .then(async players => {

            players.forEach(p => {
                const { total, count } = calculateAverageTier(p.modes);
                p.testedModes = count;
                p.averageTierScore = count > 0 ? total / count : 0;
                p.overallTier = numberToTier(Math.round(p.averageTierScore));
            });

            let filtered = players;

            if (selectedMode !== "overall") {
                filtered = players.filter(p => p.modes[selectedMode] !== null);

                filtered.sort((a, b) => {
                    return tierToNumber(b.modes[selectedMode]) - tierToNumber(a.modes[selectedMode]);
                });
            } else {
                filtered.sort((a, b) => {
                    if (b.testedModes !== a.testedModes) {
                        return b.testedModes - a.testedModes;
                    }
                    return b.averageTierScore - a.averageTierScore;
                });
            }

            const board = document.getElementById("leaderboard");
            board.innerHTML = "";

            for (const p of filtered) {
                const row = document.createElement("div");
                row.className = "playerRow";

                const skinURL = await getSkinURL(p.name);

                let modeDisplay = "";

                if (selectedMode === "overall") {
                    modeDisplay = Object.entries(p.modes)
                        .filter(([mode, tier]) => tier !== null)
                        .map(([mode, tier]) => `
                            <div class="modeTag">${mode}: ${tier}</div>
                        `)
                        .join("");
                } else {
                    modeDisplay = `
                        <div class="modeTag">${selectedMode}: ${p.modes[selectedMode]}</div>
                    `;
                }

                row.innerHTML = `
                    <div class="rank">#${filtered.indexOf(p) + 1}</div>

                    <div class="nameBlock">
                        <img class="skinHead" src="${skinURL}" alt="${p.name}">
                        <div class="playerName">${p.name}</div>
                    </div>

                    <div class="modeBlock">
                        ${modeDisplay}
                    </div>
                `;

                board.appendChild(row);
            }
        });
}

loadRankings();
</script>

</body>
</html>
