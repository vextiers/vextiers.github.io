<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VEX TIERS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>VEX TIERS</h1>

    <div class="mode-buttons">

        <button onclick="selectMode('crystal')">
            <img src="icons/crystal.png" class="icon">
            Crystal
        </button>

        <button onclick="selectMode('mace')">
            <img src="icons/mace.png" class="icon">
            Mace
        </button>

        <button onclick="selectMode('spearmace')">
            <img src="icons/spearmace.png" class="icon">
            Spear Mace
        </button>

        <button onclick="selectMode('diamond_pot')">
            <img src="icons/diamond_pot.png" class="icon">
            Diamond Pot
        </button>

        <button onclick="selectMode('netherite_pot')">
            <img src="icons/netherite_pot.png" class="icon">
            Netherite Pot
        </button>

        <button onclick="selectMode('uhc')">
            <img src="icons/uhc.png" class="icon">
            UHC
        </button>

        <button onclick="selectMode('smp')">
            <img src="icons/smp.png" class="icon">
            SMP
        </button>

        <button onclick="selectMode('sword')">
            <img src="icons/sword.png" class="icon">
            Sword
        </button>

        <button onclick="selectMode('axe')">
            <img src="icons/axe.png" class="icon">
            Axe
        </button>

    </div>

    <div id="leaderboard"></div>

    <script>
        let currentMode = null;

        function selectMode(mode) {
            currentMode = mode;
            loadLeaderboard();
        }

        async function loadLeaderboard() {
            if (!currentMode) return;

            const response = await fetch("players.json");
            const players = await response.json();

            const container = document.getElementById("leaderboard");
            container.innerHTML = "";

            players.forEach(player => {
                const tier = player.modes[currentMode];

                const card = document.createElement("div");
                card.className = "player-card";

                const icon = document.createElement("img");
                icon.className = "icon tier-" + (tier || "none");
                icon.src = "icons/" + currentMode + ".png";

                const name = document.createElement("span");
                name.textContent = `${player.name} — ${tier || "—"}`;

                card.appendChild(icon);
                card.appendChild(name);
                container.appendChild(card);
            });
        }
    </script>

</body>
</html>
